<body>

    <div class="container">
        <h2>Login</h2>
        <form #loginForm="ngForm" (ngSubmit)="login()">

            <div class="form-group">
                <input type="text" [(ngModel)]="username" name="username" #usernameField="ngModel" required />
                <label>Username</label>
                <div class="error-message"
                    *ngIf="usernameField.invalid && (usernameField.touched || usernameField.dirty)" style="color:red">
                    <div *ngIf="usernameField.errors?.required">Username is required</div>
                </div>
            </div>

            <div class="form-group">
                <input type="password" [(ngModel)]="password" name="password" #passwordField="ngModel" required />
                <label>Password</label>
                <div class="error-message"
                    *ngIf="passwordField.invalid && (passwordField.touched || passwordField.dirty)" style="color:red">
                    <div *ngIf="passwordField.errors?.required">Password is required</div>
                </div>
            </div>

            <button type="submit">Login</button>
        </form>

        <p *ngIf="errorMessage" style="color:red">{{ errorMessage }}</p>
        <p>Don't have an account? <a routerLink="/signup">Register here</a></p>
    </div>

</body>
