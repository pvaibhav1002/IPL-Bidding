<div class="auth-container">
    <div class="auth-card">
        <div class="auth-left">
            <h2>Login</h2>
            <form #loginForm="ngForm" (ngSubmit)="login()">
                <div class="form-group">
                    <input type="text" placeholder="Username" [(ngModel)]="username" name="username"
                        #usernameField="ngModel" required>
                    <div *ngIf="usernameField.invalid && (usernameField.touched || usernameField.dirty)" class="error">
                        <div *ngIf="usernameField.errors?.required">Username is required.</div>
                    </div>
                </div>

                <div class="form-group">
                    <input type="password" placeholder="Password" [(ngModel)]="password" name="password"
                        #passwordField="ngModel" required>
                    <div *ngIf="passwordField.invalid && (passwordField.touched || passwordField.dirty)" class="error">
                        <div *ngIf="passwordField.errors?.required">Password is required.</div>
                    </div>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
            <p class="switch">Don’t have an account? <a routerLink="/signup">Sign Up</a></p>
            <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
        </div>

        <div class="auth-right">
            <h3>WELCOME BACK!</h3>
            <p>Manage your IPL Bidding teams and players with ease.</p>
        </div>
    </div>
</div>
