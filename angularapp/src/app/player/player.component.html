<div class="player-container">
    <h2>Player List</h2>
  
    <!-- Full-width player list -->
    <ul class="player-list">
      <li *ngFor="let p of players">
        <div class="player-info">
          <div class="player-name">{{ p.name }}</div>
          <div class="player-details">
            (Age: {{ p.age }} | Category: {{ p.category }} | Bidding Price: {{ p.biddingPrice }})
          </div>
        </div>
        <div class="player-actions">
          <button (click)="onEditPlayer(p)">Edit</button>
          <button (click)="onDeletePlayer(p.id)">Delete</button>
        </div>
      </li>
    </ul>
  
    <!-- Edit Form -->
    <div *ngIf="editedPlayer" class="player-form">
      <h3>Edit Player</h3>
      <form #playerEditForm="ngForm" (ngSubmit)="onSaveEditedPlayer()">
        <div class="form-group">
          <input name="playerName" [(ngModel)]="editedPlayer.name" placeholder="Player Name" required />
        </div>
        <div class="form-group">
          <input type="number" name="playerAge" [(ngModel)]="editedPlayer.age" placeholder="Age" required />
        </div>
        <div class="form-group">
          <input name="playerCategory" [(ngModel)]="editedPlayer.category" placeholder="Category" required />
        </div>
        <div class="form-group">
          <input type="number" name="playerPrice" [(ngModel)]="editedPlayer.biddingPrice" placeholder="Bidding Price" required />
        </div>
  
        <div class="form-actions">
          <button type="submit" [disabled]="playerEditForm.invalid">Save</button>
          <button type="button" (click)="onCancelEditPlayer()">Cancel</button>
        </div>
        <p *ngIf="playerSuccessMessage" class="success-message">{{playerSuccessMessage}}</p>
      </form>
    </div>
  
    <!-- Create Form -->
    <div *ngIf="!editedPlayer" class="player-form">
      <h3>Create New Player</h3>
      <form #playerForm="ngForm" (ngSubmit)="createPlayer()">
        <div class="form-group">
          <input name="playerName" [(ngModel)]="newPlayer.name" placeholder="Player Name" required />
        </div>
        <div class="form-group">
          <input type="number" name="playerAge" [(ngModel)]="newPlayer.age" placeholder="Age" required />
        </div>
        <div class="form-group">
          <input name="playerCategory" [(ngModel)]="newPlayer.category" placeholder="Category" required />
        </div>
        <div class="form-group">
          <input type="number" name="playerPrice" [(ngModel)]="newPlayer.biddingPrice" placeholder="Bidding Price" required />
        </div>
        <!-- <div class="price-status">Bidding Price Status: {{ biddingPriceStatus() }}</div> -->
  
        <div class="form-actions">
          <button [disabled]="playerForm.invalid" type="submit">+ Create Player</button>
        </div>
        <p *ngIf="playerSuccessMessage" class="success-message">{{playerSuccessMessage}}</p>
      </form>
    </div>
  </div>
